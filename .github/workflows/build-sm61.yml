name: Build ONNX Runtime for CUDA sm_61 (GTX 1050 Ti)

on:
  workflow_dispatch:
    inputs:
      ort_ref:
        description: 'ONNX Runtime Git Branch/Tag/Commit'
        required: true
        default: 'main'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ONNX Runtime (CUDA 12.8 + sm_61)
    runs-on: windows-2022

    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install packaging wheel numpy

      - name: Install CUDA Toolkit 12.8
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cufft", "cufft_dev", "curand", "curand_dev", "thrust", "visual_studio_integration"]'

      - name: Download and Extract cuDNN 9.4.0
        shell: pwsh
        run: |
          $cudnnUrl = "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.4.0.58_cuda12-archive.zip"
          $zipPath = "$env:RUNNER_TEMP\cudnn.zip"
          $destPath = "C:\cudnn"
          Write-Host "Downloading cuDNN from $cudnnUrl ..."
          Invoke-WebRequest -Uri $cudnnUrl -OutFile $zipPath
          Write-Host "Extracting cuDNN to $destPath ..."
          Expand-Archive -Path $zipPath -DestinationPath $destPath -Force
          Get-ChildItem -Path $destPath

      - name: Clone ONNX Runtime Repo
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.ort_ref }}"
          if (-not $ref) { $ref = "main" }
          Write-Host "Cloning ONNX Runtime ref: $ref ..."
          git clone --depth 1 --branch $ref --recursive https://github.com/microsoft/onnxruntime.git onnxruntime-src

      - name: Build ONNX Runtime with sm_61
        shell: pwsh
        run: |
          cd onnxruntime-src
          $cudaPath = $env:CUDA_PATH
          $cudnnDir = Get-ChildItem -Path "C:\cudnn" -Directory | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using CUDA: $cudaPath"
          Write-Host "Using cuDNN: $cudnnDir"

          python tools/ci_build/build.py `
            --build_dir build/Windows `
            --config Release `
            --build_shared_lib `
            --parallel `
            --use_cuda `
            --cuda_home "$cudaPath" `
            --cudnn_home "$cudnnDir" `
            --cmake_extra_defines CMAKE_CUDA_ARCHITECTURES="61" onnxruntime_USE_FP4_QMOE=OFF `
            --skip_tests

      - name: Package Output DLLs
        shell: pwsh
        run: |
          $outputDir = "dist\onnxruntime-1.27-cuda-sm61-win64"
          New-Item -ItemType Directory -Path $outputDir -Force

          $buildOut = "onnxruntime-src\build\Windows\Release\Release"
          if (-not (Test-Path $buildOut)) {
            $buildOut = "onnxruntime-src\build\Windows\Release"
          }

          Write-Host "Searching build output in $buildOut ..."
          Get-ChildItem -Path $buildOut -Filter "*.dll" -Recurse | ForEach-Object {
            Write-Host "Found DLL: $($_.FullName)"
            Copy-Item $_.FullName -Destination $outputDir -Force
          }
          Get-ChildItem -Path $buildOut -Filter "*.lib" -Recurse | ForEach-Object {
            Copy-Item $_.FullName -Destination $outputDir -Force
          }

          Compress-Archive -Path "$outputDir\*" -DestinationPath "dist\onnxruntime-cuda-sm61-win64.zip" -Force
          Get-ChildItem -Path "dist"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-cuda-sm61-win64
          path: dist/onnxruntime-cuda-sm61-win64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.27-sm61-${{ github.run_number }}"
          name: "ONNX Runtime 1.27 for CUDA sm_61 (GTX 1050 Ti) Build #${{ github.run_number }}"
          body: |
            ### ONNX Runtime 1.27 with CUDA Compute Capability 6.1 (Pascal)
            - Target GPU: NVIDIA GeForce GTX 1050 / 1050 Ti / 1060 / 1070 / 1080 (Pascal sm_61)
            - CUDA Version: CUDA 12.8 + cuDNN 9.4
            - Included Files:
              - onnxruntime.dll
              - onnxruntime_providers_cuda.dll
              - onnxruntime_providers_shared.dll
          files: dist/onnxruntime-cuda-sm61-win64.zip
